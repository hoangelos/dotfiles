

- defaults:
    link:
      relink: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true
    brew:
      stdin: true
      stdout: true
      stderr: true
      
- shell:
    - description: "Installing submodules"
      command: >
        git submodule update --init --recursive
    - description: "Install XCode CLI Tools"
      command: >
        if [[ ! -d $(xcode-select -p) ]]; then
          xcode-select --install
        fi
    - description: "Install homebrew"
      command: >
        if [[ ! -x "$(which brew)" ]]; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        fi
    - description: "Install Powerlevel10k fonts"
      # For macOS using `cp` and `open`
      command: |
        if [[ ! -d"~/Library/Fonts/meslo" ]]; then
          cp -r fonts/meslo ~/Library/Fonts/
          open ~/Library/Fonts/meslo/*
        fi

- plugins:
    - dotbot-brew/
    - dotbot-asdf/
    - dotbot-vscode/

- clean:
    ~/:
      force: true

- create:
    ~/.ssh:
      mode: 0700

- link:
    ~/.zshrc:
      path: zshrc
    ~/.zshenv:
      path: zshenv
    ~/.gitconfig:
      mode: 0700
      path: gitconfig
    ~/.p10k.zsh:
      path: p10k.zsh


# Installs certain brew packages
- brew:
  - antigen
  - asdf
  - azure-cli
  - direnv
  - hugo
  - jq
  - wget
  - yq

- asdf:
  - plugin: python
    url: https://github.com/tuvistavie/asdf-python.git
    versions:
      - 3.10.18
      - 3.11.13
      - 3.12.11
      - 3.13.6
    default: 3.13.6  # Set in home directory (replaces global)
  
- shell:
    - description: "Making zsh the default shell"
      command: >
        if [[ "$SHELL" != "$(which zsh)"  ]]; then
          chsh -s $(which zsh)
        fi
    - description: "Creating ssh key (if needed)"
      command: >
        if [[ ! -f "$HOME/.ssh/id_ed25519" ]]; then
          ssh-keygen -t ed25519 -f $HOME/.ssh/id_ed25519 -N "" -C "pjh239@cornell.edu"
        fi 
    - description: "Show extensions on files"
      command: >
        defaults write NSGlobalDomain AppleShowAllExtensions -bool true
    - description: "Don't show recents in Docks"
      command: defaults write com.apple.dock show-recents -bool false
    - description: "Hot corner lower left, lock computer"
      command: defaults write com.apple.dock wvous-bl-corner -int 13
    - description: "Show List view in Finder"
      command: defaults write com.apple.finder FXPreferredViewStyle -string "Nlsv"
    - description: "Search current folder"
      command: defaults write com.apple.finder FXDefaultSearchScope -string "SCcf"
    - descdescriptionription: "Enable scrollbars"
      command: defaults write NSGlobalDomain AppleShowScrollBars -string "Always"
    - description: "Disable Auto Capitalization"
      command: defaults write NSGlobalDomain NSAutomaticCapitalizationEnabled -bool false
